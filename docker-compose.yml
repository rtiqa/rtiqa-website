version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rtiqa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-rtiqa_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rtiqa_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rtiqa-network

volumes:
  postgres_data:
    name: rtiqa_postgres_data

networks:
  rtiqa-network:
    name: rtiqa_network
