version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rtiqa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-rtiqa_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-rtiqa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rtiqa-network

  minio:
    image: minio/minio:latest
    container_name: rtiqa-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_local_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rtiqa-network

  minio-init:
    image: minio/mc:latest
    container_name: rtiqa-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin_local_secret}; do
        echo 'Waiting for MinIO...';
        sleep 1;
      done;
      /usr/bin/mc mb --ignore-existing local/${S3_BUCKET:-rtiqa-storage};
      echo 'MinIO storage bucket ready.';
      exit 0;
      "
    networks:
      - rtiqa-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rtiqa-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@postgres:5432/${PGDATABASE:-rtiqa_db}?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET:-local_dev_jwt_hmac_secret_key_32bytes_minimum_length}
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-rtiqa-storage}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_local_secret}
      S3_FORCE_PATH_STYLE: "true"
      STORAGE_URL_TTL: 900
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - rtiqa-network

volumes:
  postgres_data:
    name: rtiqa_postgres_data
  minio_data:
    name: rtiqa_minio_data

networks:
  rtiqa-network:
    name: rtiqa_network
